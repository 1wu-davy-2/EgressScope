name: Windows ARM64 build

on:
  workflow_dispatch:
  push:
    branches:
      - "ci/windows-arm64**"

permissions:
  contents: read

jobs:
  build:
    name: Build / windows-arm64
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Show toolchain
        shell: pwsh
        run: |
          python -c "import platform,sys; print(sys.version); print(sys.executable); print(platform.machine()); print(platform.architecture())"
          rustc -V
          cargo -V
          rustup show

      - name: Add Rust ARM64 target
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Probe OpenSSL toolchain
        shell: pwsh
        run: |
          Write-Output "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          $found = @()
          $roots = @("C:\Program Files\OpenSSL*", "$env:VCPKG_INSTALLATION_ROOT", "C:\Strawberry")
          foreach ($root in $roots) {
            if ($root -and (Test-Path $root)) {
              $found += Get-ChildItem -Path $root -Filter libcrypto.lib -Recurse -Depth 6 -ErrorAction SilentlyContinue |
                Select-Object -First 10 -ExpandProperty FullName
            }
          }
          $found | ForEach-Object { Write-Output "libcrypto: $_" }
          "### OpenSSL probe" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($found) { $found | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          else { "no libcrypto.lib found" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Install aioquic from source
        shell: pwsh
        run: |
          python -m pip install --upgrade pip 2>&1 | Tee-Object -FilePath pip-install.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --no-cache-dir aioquic==1.2.0 cryptography==46.0.3 pyOpenSSL==26.2.0 service-identity==24.2.0 2>&1 | Tee-Object -FilePath aioquic-install.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt 2>&1 | Tee-Object -FilePath pip-install.log -Append
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify native modules
        shell: pwsh
        run: |
          python -c "import platform, psutil, cryptography, mitmproxy_rs, brotli, aioquic; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; print('machine', platform.machine()); print('cryptography', cryptography.__version__); print('mitmproxy_rs', mitmproxy_rs.__version__ if hasattr(mitmproxy_rs,'__version__') else 'ok'); print('psutil', psutil.__version__)"

      - name: Smoke test
        shell: pwsh
        run: python tests/smoke_test.py

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller build.spec --noconfirm --clean 2>&1 | Tee-Object -FilePath pyinstaller.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Packaged acceptance test
        shell: pwsh
        run: python tests/packaged_test.py

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $asset = "EgressScope-dev-windows-arm64.exe"
          Copy-Item dist/EgressScope.exe "release/$asset"
          $hash = (Get-FileHash -Algorithm SHA256 "release/$asset").Hash.ToLower()
          Set-Content "release/$asset.sha256" "$hash *$asset"
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: EgressScope-windows-arm64
          path: release/*
          if-no-files-found: error

      - name: Report failures
        if: failure()
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          "## Failure diagnostics" | Out-File -FilePath $summary -Append -Encoding utf8
          $pattern = 'error|fatal|failed|LNK\d+|C1083|C2065|C2059|undefined|cannot open'
          $matched = @()
          foreach ($log in @("aioquic-install.log", "pip-install.log", "pyinstaller.log")) {
            if (Test-Path $log) {
              $lines = Get-Content $log
              $hits = $lines | Select-String -Pattern $pattern | Select-Object -First 120
              "### $log (last 30 lines)" | Out-File -FilePath $summary -Append -Encoding utf8
              '```' | Out-File -FilePath $summary -Append -Encoding utf8
              $lines | Select-Object -Last 30 | Out-File -FilePath $summary -Append -Encoding utf8
              '```' | Out-File -FilePath $summary -Append -Encoding utf8
              if ($hits) {
                "### $log matching lines" | Out-File -FilePath $summary -Append -Encoding utf8
                '```' | Out-File -FilePath $summary -Append -Encoding utf8
                $hits | ForEach-Object { $_.Line } | Out-File -FilePath $summary -Append -Encoding utf8
                '```' | Out-File -FilePath $summary -Append -Encoding utf8
                $matched += $hits | ForEach-Object { $_.Line }
              }
            }
          }
          $compact = (($matched | Select-Object -Last 12) -join "`n") -replace '%', '%25'
          $compact = $compact -replace "`r", ''
          $compact = $compact -replace "`n", '%0A'
          if ($compact.Length -gt 3500) { $compact = $compact.Substring($compact.Length - 3500) }
          if ($compact) { Write-Output "::error title=Build diagnostics::$compact" }
