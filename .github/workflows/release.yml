name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            arch: x64
          - platform: windows-arm64
            os: windows-11-arm
            arch: arm64
          - platform: linux-x64
            os: ubuntu-22.04
            arch: x64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
          - platform: macos-x64
            os: macos-15-intel
            arch: x64
          - platform: macos-arm64
            os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Add Rust ARM64 target
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Verify ARM64 interpreter
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: python -c "import platform; assert platform.machine() == 'ARM64', platform.machine(); print(platform.machine())"

      - name: Build ARM64 OpenSSL for aioquic
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw "vcpkg is not available on this runner" }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:arm64-windows --clean-after-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\arm64-windows"
          $dll = Get-ChildItem "$installed\bin\libcrypto*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "libcrypto DLL not found under $installed\bin" }
          "INCLUDE=$installed\include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$installed\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATH=$installed\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EGRESS_SCOPE_OPENSSL_DLL=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Using $($dll.FullName)"

      - name: Enter ARM64 developer environment
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with ARM64 tools not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }
          $lines = cmd /c "`"$vcvars`" arm64 >nul && set"
          if ($LASTEXITCODE) { throw "vcvarsall arm64 failed" }
          $keep = @("INCLUDE", "LIB", "LIBPATH", "PATH", "VCINSTALLDIR", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion", "UCRTVersion", "VSCMD_ARG_TGT_ARCH")
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $matches[1] -in $keep) {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          "CC=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "VS: $vsPath"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Smoke test (Windows ARM64)
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: python tests/smoke_test.py

      - name: Build executable
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Packaged acceptance test (Windows ARM64)
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: python tests/packaged_test.py

      - name: Package artifact
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [[ "$PLATFORM" == windows-* ]]; then
            asset="EgressScope-${TAG}-${PLATFORM}.exe"
            cp dist/EgressScope.exe "release/$asset"
          else
            asset="EgressScope-${TAG}-${PLATFORM}"
            cp dist/EgressScope "release/$asset"
            chmod +x "release/$asset"
            (cd release && tar -czf "${asset}.tar.gz" "$asset")
            rm "release/$asset"
            asset="${asset}.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release && sha256sum "$asset" > "${asset}.sha256")
          else
            (cd release && shasum -a 256 "$asset" > "${asset}.sha256")
          fi
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: EgressScope-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: EgressScope-*
          merge-multiple: true

      - name: Generate checksum manifest
        run: |
          set -euo pipefail
          cd release
          ls -lh
          for file in *; do
            case "$file" in
              *.sha256|SHA256SUMS.txt) continue ;;
            esac
            sha256sum "$file"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
