name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: linux-x64
            os: ubuntu-22.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-x64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build executable
        run: python -m PyInstaller build.spec --noconfirm --clean

      - name: Package artifact
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "$PLATFORM" = "windows-x64" ]; then
            asset="EgressScope-${TAG}-windows-x64.exe"
            cp dist/EgressScope.exe "release/$asset"
          else
            asset="EgressScope-${TAG}-${PLATFORM}"
            cp dist/EgressScope "release/$asset"
            chmod +x "release/$asset"
            (cd release && tar -czf "${asset}.tar.gz" "$asset")
            rm "release/$asset"
            asset="${asset}.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release && sha256sum "$asset" > "${asset}.sha256")
          else
            (cd release && shasum -a 256 "$asset" > "${asset}.sha256")
          fi
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: EgressScope-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
