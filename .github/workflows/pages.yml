name: Deploy intro page

on:
  push:
    branches: [main]
    paths:
      - "web/intro.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        run: |
          mkdir -p _site
          sed "s|__REPO_URL__|https://github.com/${{ github.repository }}|g" web/intro.html > _site/index.html
          grep -q "https://github.com/${{ github.repository }}" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
